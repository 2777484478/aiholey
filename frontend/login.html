<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · Aiholey 代码审计平台</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<style>
  :root{
    --bg:#070b1a; --panel:rgba(20,26,50,.72); --line:rgba(120,160,255,.16);
    --txt:#e8ecff; --dim:#8b96c4; --cyan:#22d3ee; --violet:#8b5cf6;
    --pink:#f472b6; --lime:#a3e635; --amber:#fbbf24; --red:#fb7185;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); display:grid; place-items:center;
    overflow:hidden; position:relative;
  }
  /* 背景光晕 */
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;animation:float 14s ease-in-out infinite}
  .orb.a{width:520px;height:520px;background:radial-gradient(circle,#3b82f6,transparent 68%);top:-160px;left:-120px}
  .orb.b{width:460px;height:460px;background:radial-gradient(circle,#a855f7,transparent 68%);bottom:-150px;right:-110px;animation-delay:-4s}
  .orb.c{width:360px;height:360px;background:radial-gradient(circle,#06b6d4,transparent 68%);top:38%;left:56%;animation-delay:-8s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(38px,-30px) scale(1.12)}}
  .grid-bg{
    position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 78%);
  }

  .card{
    position:relative;z-index:2;width:min(940px,94vw);min-height:520px;
    display:grid;grid-template-columns:1.05fr .95fr;
    background:var(--panel);backdrop-filter:blur(26px);
    border:1px solid var(--line);border-radius:24px;overflow:hidden;
    box-shadow:0 32px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;
    animation:rise .6s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}

  .brand{
    padding:52px 44px;position:relative;
    background:linear-gradient(150deg,rgba(59,130,246,.20),rgba(168,85,247,.16) 48%,rgba(6,182,212,.14));
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .logo{display:flex;align-items:center;gap:13px}
  .logo-mark{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 10px 30px rgba(139,92,246,.5);
  }
  .logo-mark svg{width:26px;height:26px}
  .logo-txt b{display:block;font-size:20px;letter-spacing:.4px}
  .logo-txt span{font-size:11.5px;color:var(--dim);letter-spacing:2.6px;text-transform:uppercase}
  .brand h1{font-size:31px;line-height:1.32;margin:34px 0 14px;font-weight:700}
  .brand h1 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{color:var(--dim);font-size:13.5px;line-height:1.85}
  .features{display:flex;flex-direction:column;gap:11px;margin-top:26px}
  .feat{display:flex;align-items:center;gap:10px;font-size:13px;color:#c3ccf0}
  .feat i{
    width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;
    background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.3);font-size:11px;
  }
  .brand .foot{font-size:11.5px;color:#5f6a96;letter-spacing:.4px}

  .form-wrap{padding:52px 44px;display:flex;flex-direction:column;justify-content:center}
  .form-wrap h2{font-size:23px;margin-bottom:6px}
  .form-wrap .sub{color:var(--dim);font-size:13px;margin-bottom:28px}

  .field{margin-bottom:17px}
  .field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:8px;letter-spacing:.3px}
  .ip{
    display:flex;align-items:center;gap:10px;padding:0 14px;height:47px;
    background:rgba(9,13,30,.72);border:1px solid var(--line);border-radius:12px;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .ip:focus-within{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 4px rgba(34,211,238,.10);background:rgba(9,13,30,.95)}
  .ip svg{width:17px;height:17px;opacity:.55;flex:0 0 auto}
  .ip input{
    flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px;height:100%;
    font-family:inherit;
  }
  .ip input::placeholder{color:#4d5885}
  /* Chromium 密码管理器自动填充时会强制给 input 刷一层内置的白底/黄底 + 黑字，
     优先级高于普通样式，background 直接改不掉。惯用解法是用一个超大内阴影
     把它的底色盖住，并显式指定文字与光标颜色。
     #0b1022 ≈ 包装层 rgba(9,13,30,.72) 叠在面板上的实色，避免输入区与外框出现色差。 */
  .ip input:-webkit-autofill,
  .ip input:-webkit-autofill:hover,
  .ip input:-webkit-autofill:focus{
    -webkit-box-shadow:0 0 0 1000px #0b1022 inset;
    -webkit-text-fill-color:var(--txt);
    caret-color:var(--txt);
    border-radius:0; /* 内阴影是方的，输入框本身不需要圆角（圆角在外层 .ip 上） */
    transition:background-color 999999s ease-out; /* 兜底：延缓浏览器后续再刷底色 */
  }
  .eye{background:none;border:0;cursor:pointer;opacity:.5;padding:4px;display:grid;place-items:center}
  .eye:hover{opacity:.9}
  .eye svg{width:17px;height:17px}

  .btn{
    width:100%;height:48px;margin-top:10px;border:0;border-radius:12px;cursor:pointer;
    font-size:14.5px;font-weight:600;color:#04121f;font-family:inherit;
    background:linear-gradient(100deg,var(--cyan),#60a5fa 50%,var(--violet));
    box-shadow:0 12px 32px rgba(59,130,246,.34);
    transition:transform .15s,box-shadow .2s,filter .2s;
  }
  .btn:hover{transform:translateY(-1.5px);box-shadow:0 18px 40px rgba(59,130,246,.46);filter:brightness(1.06)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  .msg{
    margin-top:15px;padding:11px 13px;border-radius:10px;font-size:12.8px;display:none;
    border:1px solid transparent;line-height:1.6;
  }
  .msg.err{display:block;background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.34);color:#ffc4ce}
  .msg.ok{display:block;background:rgba(163,230,53,.12);border-color:rgba(163,230,53,.3);color:#dcf79b}
  .hint{
    margin-top:22px;padding:13px 14px;border-radius:11px;font-size:12.2px;color:var(--dim);
    background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.24);line-height:1.7;
  }
  .hint b{color:#c4b5fd}
  code{
    background:rgba(255,255,255,.08);padding:1.5px 6px;border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.8px;color:#a5f3fc;
  }
  @media(max-width:820px){
    .card{grid-template-columns:1fr}
    .brand{display:none}
    .form-wrap{padding:40px 28px}
  }
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="grid-bg"></div>

<div class="card">
  <div class="brand">
    <div>
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#04121f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5 4 6.2v5.4c0 4.6 3.2 8.7 8 9.9 4.8-1.2 8-5.3 8-9.9V6.2z"/>
            <path d="m8.6 12.1 2.3 2.3 4.5-4.6"/>
          </svg>
        </div>
        <div class="logo-txt"><b>Aiholey</b><span>Code Audit</span></div>
      </div>
      <h1>AI 驱动的<br/><em>代码安全审计</em>平台</h1>
      <p>配置 Git 仓库自动拉取代码，按技能库逐项调用 AI 引擎审计，定时排队执行，产出分级漏洞报告。</p>
      <div class="features">
        <div class="feat"><i>◆</i>Git 仓库自动拉取与分支管理</div>
        <div class="feat"><i>◆</i>26 项安全技能库 · AI + 规则双引擎</div>
        <div class="feat"><i>◆</i>定时调度 · 排队执行 · 实时日志</div>
        <div class="feat"><i>◆</i>分级报告 · 复扫 · 批量导出</div>
      </div>
    </div>
    <div class="foot">v2.0 · FastAPI + 原生前端 · 本地部署</div>
  </div>

  <div class="form-wrap">
    <h2>欢迎回来</h2>
    <div class="sub">登录以进入审计控制台</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">用户名</label>
        <div class="ip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="username" name="username" placeholder="请输入用户名" autocomplete="username" required />
        </div>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <div class="ip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
          <button class="eye" type="button" id="togglePwd" title="显示/隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" type="submit" id="submitBtn">登 录</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="hint">
      首次使用默认账户 <b>admin / admin123</b>，登录后请到「模型设置」修改密码。<br/>
      AI 语义分析需在「模型设置」里填入 API Key；未配置时自动降级为内置规则扫描。
    </div>
  </div>
</div>

<script src="/static/login.js?v=1"></script>
</body>
</html>
